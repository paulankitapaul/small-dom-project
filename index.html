
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md z-10 top-0 sticky ">
        <div class="max-w-7xl mx-auto px-4 py-4
                    flex flex-col gap-4
                    sm:flex-row sm:items-center sm:justify-between">

            <!-- Home -->
            <div>
                <a href="#" class="text-2xl font-bold text-blue-600">
                    Home
                </a>
            </div>

            <!-- Menu -->
            <div class="flex items-center justify-center gap-6">
                <a href="#about" class="text-gray-600 hover:text-blue-600">
                    About
                </a>

                <a href="#others" class="text-gray-600 hover:text-blue-600">
                    Others
                </a>

                <a href="#contact" class="text-gray-600 hover:text-blue-600">
                    Contact
                </a>
            </div>

            <!-- Balance -->
            <div>
                <button class="bg-blue-600 text-white font-semibold
                               px-5 py-2 rounded-lg">
                    Balance: $<span id="balance">5000</span>
                </button>
            </div>

        </div>
    </nav>


    <!-- Hero Section -->
    <main class="max-w-7xl mx-auto px-4 py-10">

        <!-- Heading -->
        <div class="text-center mb-10">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800">
                Welcome to My Dashboard
            </h1>

            <p class="text-gray-500 mt-3">
                Manage your money from one place.
            </p>
        </div>


        <!-- Cards Container -->
        <section class="grid grid-cols-1 sm:grid-cols-2 gap-6">

            <!-- Card 1: Add Money -->
            <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-md
                        hover:shadow-xl transition" id="ad-money-section">

                <img
                    src="https://placehold.co/600x300/dbeafe/1d4ed8?text=Add+Money"
                    alt="Add Money"
                    class="w-full h-48 object-cover rounded-xl">

                <h2 class="text-xl font-bold mt-5">
                    Add Money
                </h2>

                <p class="text-gray-500 text-sm mt-2 mb-4">
                    Add money to your account.
                </p>

                <label for="add-amount"
                       class="block text-sm font-medium text-gray-700 mb-2">
                    Enter Amount
                </label>

                <input
                    type="number"
                    id="add-amount"
                    placeholder="Enter amount"
                    class="w-full border border-gray-300 rounded-lg
                           px-4 py-3 outline-none
                           focus:border-blue-500">

                <button
                    class="w-full bg-blue-600 hover:bg-blue-700
                           text-white py-3 rounded-lg mt-4" id="ad-money-btn">
                    Add Money
                </button>

            </div>


            <!-- Card 2: Cash Out -->
            <div class="bg-white p-5 sm:p-6 rounded-2xl shadow-md
                        hover:shadow-xl transition" id="cashout-section">

                <img
                    src="https://placehold.co/600x300/dcfce7/15803d?text=Cash+Out"
                    alt="Cash Out"
                    class="w-full h-48 object-cover rounded-xl">

                <h2 class="text-xl font-bold mt-5">
                    Cash Out
                </h2>

                <p class="text-gray-500 text-sm mt-2 mb-4">
                    Withdraw money from your account.
                </p>

                <label for="cashout-amount"
                       class="block text-sm font-medium text-gray-700 mb-2">
                    Enter Amount
                </label>

                <input
                    type="number"
                    id="cashout-amount"
                    placeholder="Enter amount"
                    class="w-full border border-gray-300 rounded-lg
                           px-4 py-3 outline-none
                           focus:border-green-500">

                <button
                    class="w-full bg-green-600 hover:bg-green-700
                           text-white py-3 rounded-lg mt-4" id="cash-out-btn">
                    Cash Out
                </button>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="text-center text-gray-500 py-6">
        <p>© 2026 My Dashboard</p>
    </footer>
    <script src="./js/ad-money.js"></script>
     <script src="cashout.js"></script>

</body>
</html>
